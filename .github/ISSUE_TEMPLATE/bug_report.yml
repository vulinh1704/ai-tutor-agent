name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please never paste API keys or real student data.
        If you can, reproduce the problem with `LLM_PROVIDER=fake` first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, requests (curl) and configuration needed to reproduce it.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: LLM provider
      options:
        - fake (offline)
        - openai
        - anthropic
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 / abc1234"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Python 3.12, Ubuntu 24.04, Docker 28"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
