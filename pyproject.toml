[project]
name = "ai-tutor-agent"
version = "0.1.0"
description = "A production-ready starter for AI tutoring agents: FastAPI + LangGraph, with Socratic hints, rubric-based grading and session memory."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vu Linh Truong" }]
requires-python = ">=3.11"
keywords = ["ai-tutor", "langgraph", "fastapi", "llm", "edtech", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "langchain-core>=1.7,<2",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.7,<2",
]

[project.optional-dependencies]
sqlite = ["langgraph-checkpoint-sqlite>=3.1,<4"]

[project.urls]
Homepage = "https://github.com/vulinh1704/ai-tutor-agent"
Issues = "https://github.com/vulinh1704/ai-tutor-agent/issues"
Changelog = "https://github.com/vulinh1704/ai-tutor-agent/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "N",        # pep8-naming
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls
    "PT",       # pytest style
    "RET",      # return statements
    "PTH",      # pathlib
    "TID",      # tidy imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["ai_tutor_agent"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["ai_tutor_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
